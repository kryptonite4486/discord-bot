services:
  discord-bot:
    build: .
    container_name: weekly-metrics-bot
    restart: unless-stopped
    env_file:
      - .env
    volumes:
      - ./data:/app/data
      # Live-mount app code so host edits apply without a full image rebuild.
      # /admin reload picks up cog changes; restart for main/config changes.
      - ./bot:/app/bot
    environment:
      - DATABASE_PATH=/app/data/weekly.db
    # Reach oMLX / other services on the Mac host (Docker Desktop provides
    # host.docker.internal; host-gateway covers Linux Compose as well).
    extra_hosts:
      - "host.docker.internal:host-gateway"
