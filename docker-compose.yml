services:
  discord-bot:
    build: .
    container_name: weekly-metrics-bot
    restart: unless-stopped
    env_file:
      - .env
    volumes:
      - ./data:/app/data
      - easyocr-cache:/app/.EasyOCR
    environment:
      - DATABASE_PATH=/app/data/weekly.db
      - EASYOCR_MODULE_PATH=/app/.EasyOCR
    # Reach oMLX / other services on the Mac host (Docker Desktop provides
    # host.docker.internal; host-gateway covers Linux Compose as well).
    extra_hosts:
      - "host.docker.internal:host-gateway"

volumes:
  easyocr-cache: